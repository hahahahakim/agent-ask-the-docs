services:
  agent:
    build: .
    container_name: agent-docs
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - agent-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  agent-data:
